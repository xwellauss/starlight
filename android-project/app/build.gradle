plugins {
    id 'com.android.application'
}

task copyNativeLib(type: Copy) {
    from '../../bin/android-arm64-debug/src/libstarlight.so'
    into 'src/main/jniLibs/arm64-v8a/'
}

preBuild.dependsOn copyNativeLib

android {
    compileSdk 30 //
    ndkVersion '25.1.8937393'	

    defaultConfig {	
        applicationId = 'io.github.xwellauss.starlight'
        minSdkVersion 30
        targetSdkVersion 30
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
		}
		debug {
            debuggable true
        }
    }

	sourceSets {
        main {
            assets.srcDirs = ['../../assets']
        }
    }
	
	lintOptions {
		abortOnError false
    }

	namespace 'io.github.xwellauss.starlight'
}

